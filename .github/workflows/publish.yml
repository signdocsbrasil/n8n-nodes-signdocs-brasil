name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # id-token: write — was required for the OIDC Trusted Publisher path. Removed
  # because we publish with a Classic Automation NPM_TOKEN (Trusted Publisher
  # setup is gated on TOTP/security-key 2FA on the npm account, which we
  # haven't enabled). Re-add this permission and the --provenance flag below
  # when Trusted Publisher is configured.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      - run: npm run build

      - run: npm run lint

      - name: Verify package passes n8n community-node scanner
        run: |
          npm pack --pack-destination /tmp/
          # Scanner downloads from registry, so we validate after publish too
          echo "local pack + lint OK; scanner re-run post-publish in next step"

      - name: Publish
        # No --provenance: it requires the OIDC Trusted Publisher binding, which
        # in turn requires 2FA on the npm account. Using a Classic Automation
        # token (NPM_TOKEN secret) instead. Loses the sigstore attestation but
        # unblocks the release.
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Post-publish scan
        run: |
          sleep 10  # wait for npm registry to propagate
          PKG_VERSION=$(node -p "require('./package.json').version")
          npx -y @n8n/scan-community-package@latest n8n-nodes-signdocs-brasil@$PKG_VERSION
